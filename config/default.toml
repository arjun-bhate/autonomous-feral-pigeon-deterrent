# Every tunable value for the deterrent system. The unit is part of each name
# (ms = milliseconds, cdeg = centidegrees = hundredths of a degree).
# Any value can be overridden by an environment variable named PIGEON_<NAME>,
# for example PIGEON_WATCHDOG_MS=1500. Values marked provisional are re-tuned later.
# Source of truth: protocol/PROTOCOL.md section 8.

heartbeat_interval_ms = 200
watchdog_ms = 1000                # provisional
person_clear_holdoff_ms = 1000    # provisional
person_reengage_delay_ms = 5000   # provisional; 0 disables the delay
fire_ttl_ms = 500
command_ttl_ms = 500
per_shot_ms = 5000                # provisional; must be 500 or more
cooldown_ms = 5000                # provisional; 0 disables the cooldown
zone_upload_timeout_ms = 5000
homing_duration_ms = 3000
aiming_error_cdeg = 20
max_zones = 8
max_points_per_zone = 16
elevation_min_cdeg = 0
elevation_max_cdeg = 8000

# Developer tools in the dashboard API. On by default in feature 001 only.
dev_tools = true
