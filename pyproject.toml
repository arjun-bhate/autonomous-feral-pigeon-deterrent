[project]
name = "deterrent"
version = "0.1.0"
description = "Autonomous Feral Pigeon Deterrent System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deterrent"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/contract",
    "tests/integration",
    "tests/architecture",
]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long simulated runs (the 5-minute health soak); run alone with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1510"]

[tool.ruff.lint.isort]
known-first-party = ["deterrent", "support"]
